<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museum of Graphics</title>
<meta name="description" content="A playable history of computer graphics: from a single phosphor dot to a path-traced ray of light.">
<meta property="og:title" content="Museum of Graphics">
<meta property="og:description" content="From one dot to a ray of light. A playable history of computer graphics.">
<meta property="og:image" content="og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#050505">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050505'/%3E%3Crect x='5' y='3' width='6' height='10' fill='%23ffb547'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Silkscreen&family=VT323&display=swap">
<link rel="stylesheet" href="styles.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body data-ui="museum">
<canvas id="gl" aria-label="Interactive exhibit"></canvas>
<div id="ui">
  <header id="hud"><span class="num"></span><span class="ttl"></span><span class="yr"></span></header>
  <div id="topright">
    <button class="btn" id="secrets" title="Secrets found">◆ <span class="n">0/0</span></button>
    <button class="btn" id="sound">Sound on</button>
    <button class="btn" id="share">Share</button>
  </div>
  <section class="win hidden" id="notes" aria-label="Exhibit notes"><div class="tb"><span class="t">Exhibit notes</span><span class="x" role="button" aria-label="Collapse">–</span></div><div class="bd"></div></section>
  <section class="win hidden" id="controls" aria-label="Controls"><div class="tb"><span class="t">Controls</span><span class="x" role="button" aria-label="Collapse">–</span></div><div class="bd"></div></section>
  <div id="titlecard" class="passive"></div>
  <div id="toasts" class="passive"></div>
  <div id="bottom">
    <button class="btn" id="prev" hidden>←</button>
    <nav id="timeline" aria-label="Eras"></nav>
    <button class="btn" id="next">Next era →</button>
  </div>
  <div id="gate">
    <div class="c">
      <div class="msg">Every image you have ever seen on a screen began as <em>one glowing dot</em>.</div>
      <div class="from" hidden></div>
      <div class="go">Click to switch on · best with sound</div>
    </div>
  </div>
  <div id="modal"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
